[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-redact"
version = "0.4.1"
description = "Local, review-first PDF redaction for lawyers, with independent export checks."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Kirill Sakhin" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Legal Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]
dependencies = ["pymupdf>=2.1,<3", "pdfminer.six", "pypdfium2", "pikepdf", "lxml>=5"]

[project.optional-dependencies]
dev = ["pytest", "reportlab", "faker", "python-docx"]   # python-docx: test fixtures / sanity only, never imported by the package
ml = ["gliner", "presidio-analyzer", "spacy", "torch"]

[project.scripts]
legal-redact = "legal_redact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
legal_redact = ["policies/*.toml", "web/*.html", "bench/*SHA256", "bench/*.json", "bench/*.md"]
